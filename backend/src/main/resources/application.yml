spring:
  application:
    name: fanclash-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fanclash}
    username: ${DATABASE_USER:fanclash}
    password: ${DATABASE_PASSWORD:fanclash}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

fanclash:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    secret: ${ADMIN_SECRET:dev-secret}
  api:
    version: v1

fanmeter:
  chat:
    bot:
      enabled: ${FANMETER_BOT_ENABLED:true}
      cron: "${FANMETER_BOT_CRON:0 0/30 * * * *}"
      min-comments: ${FANMETER_BOT_MIN_COMMENTS:5}
      max-comments: ${FANMETER_BOT_MAX_COMMENTS:10}
      max-per-contestant: ${FANMETER_BOT_MAX_PER_CONTESTANT:3}
      # Comma-separated "eventSlug:seasonId" pairs
      targets: "${FANMETER_BOT_TARGETS:bigg-boss-tamil-10:6}"
  nomination-sync:
    # Monday forced re-sync fires 8:30 PM IST (15:00 UTC) every week.
    # In production use Cloud Scheduler to POST /api/admin/nomination-sync/trigger?force=true
    # instead of relying on this cron (Cloud Run scales to zero between requests).
    monday-cron: "${FANMETER_MONDAY_SYNC_CRON:0 0 15 * * MON}"
