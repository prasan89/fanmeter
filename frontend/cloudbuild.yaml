steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://fanclash-api-lenl7h57yq-uc.a.run.app'
      - '-t'
      - 'us-central1-docker.pkg.dev/fanclash-prod/fanclash-docker/fanclash-web:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/fanclash-prod/fanclash-docker/fanclash-web:m3'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/fanclash-prod/fanclash-docker/fanclash-web:latest'
  - 'us-central1-docker.pkg.dev/fanclash-prod/fanclash-docker/fanclash-web:m3'
timeout: '900s'
options:
  machineType: 'E2_HIGHCPU_8'
